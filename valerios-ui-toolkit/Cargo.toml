[package]
name = "valerios-ui-toolkit"
version = "0.1.0"
edition = "2024"

[features]
default = ["full"]
full = [
    "accordion", "alert", "alert_dialog", "aspect_ratio", "avatar", "badge",
    "breadcrumb", "button", "button_group", "calendar", "card", "checkbox",
    "collapsible", "combobox", "command", "confirm_delete", "context_menu", "date_picker",
    "data_table", "dialog", "direction", "drawer", "dropdown_menu", "empty",
    "field", "hover_card", "icon", "image_cropper", "input", "input_group", "item", "kbd",
    "label", "maps", "menubar", "native_select", "navigation_menu", "pagination",
    "password_input", "popover", "progress", "radio_group", "resizable", "scroll_area",
    "select", "separator", "sheet", "sidebar", "skeleton", "slider",
    "sonner", "spinner", "switch", "table", "tabs", "textarea", "theme", "toggle",
    "toggle_group", "tooltip", "typography",
]

accordion = []
alert = []
alert_dialog = ["shared", "button"]
aspect_ratio = []
avatar = []
badge = []
breadcrumb = []
button = []
button_group = []
calendar = ["icon"]
card = []
checkbox = []
collapsible = []
combobox = ["popover", "button", "icon", "command"]
command = ["icon"]
confirm_delete = ["dialog", "button", "icon"]
context_menu = []
date_picker = ["shared", "calendar"]
data_table = ["table", "icon"]
dialog = ["shared"]
direction = []
drawer = ["shared"]
dropdown_menu = ["shared"]
empty = []
field = []
hover_card = []
icon = []
image_cropper = ["dialog", "button", "icon", "dep:image"]
input = []
input_group = []
item = []
kbd = []
label = []
maps = ["dep:js-sys", "dep:wasm-bindgen-futures"]
menubar = ["shared"]
native_select = []
navigation_menu = []
pagination = ["icon"]
password_input = ["input", "icon"]
popover = ["shared"]
progress = []
radio_group = []
resizable = []
scroll_area = []
select = ["shared"]
separator = []
shared = []
sheet = ["shared"]
sidebar = []
skeleton = []
slider = []
sonner = ["icon"]
spinner = []
switch = []
table = []
tabs = []
textarea = []
theme = []
toggle = []
toggle_group = []
tooltip = ["shared"]
typography = []

[dependencies]
leptos = { version = "0.8" }
chrono = { version = "0.4", features = ["serde"] }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlDocument", "Element", "HtmlElement", "Location", "HtmlDivElement", "Request", "RequestInit", "RequestMode", "Response"] }
wasm-bindgen = "0.2"
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
