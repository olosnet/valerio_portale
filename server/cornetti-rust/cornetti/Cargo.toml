[package]
name = "cornetti"
version = "0.2.0"
edition = "2024"
authors = ["Valerio Faiuolo <valerio.faiuolo@errepinet.it>"]
description = "Cornetti base framework"

[features]
mongo = ["mongodb", "bson"]
actix = ["actix-web"]
sqlxdb = ["sqlx"]
sqlxdb-mysql = ["sqlxdb", "sqlx/mysql"]
sqlxdb-postgres = ["sqlxdb", "sqlx/postgres"]
sqlxdb-sqlite = ["sqlxdb", "sqlx/sqlite"]
sqlxdb-tls = ["sqlxdb", "sqlx/tls-native-tls"]
grpc = ["tonic"]
grpc-tls = ["grpc", "tonic/tls-ring", "tonic/tls-webpki-roots"]
filemanager = ["tree_magic_mini", "sanitize-filename"]
filemanager-images = ["rgb", "jpeg-decoder", "png", "jpeg-encoder", "image-webp", "resize", "filemanager"]
actix-filemanager = ["actix", "actix-files", "actix-multipart", "actix-files", "filemanager"]
actix-filemanager-images = ["actix-filemanager", "filemanager-images"]
auth = ["jsonwebtoken"]
actix-auth = ["actix", "auth"]
auth-apikey = []
actix-auth-apikey = ["actix", "auth-apikey"]
redisdb = ["redis"]
templates = ["minijinja"]
mail = ["lettre"]
mail-gmail = ["mail", "auth", "reqwest", "base64"]


[dependencies]
# Core deps
serde = { version = "1", features = ["derive"] }
rand = "0.10.0"
chrono = { version ="0.4", features = ["serde"] }
utoipa = { version ="5", features = ["chrono"]}
argon2 = { version = "0.5.3", features = ["std"] }
rand_core = { version = "0.10.0" }
uuid = { version = "1.17.0", features = ["v4"]}
futures-util = "0.3.31"
regex = "1.11.1"
validator = { version = "0.20.0", features = ["derive"] }
rust_decimal = { version = "1.37.2" }
serde_json = "1.0.140"
log = { version = "0.4.27" }
tokio = { version = "1", features = ["time"] }

# Auth deps
jsonwebtoken = { version = "10.3.0", features=["rust_crypto", "use_pem"], optional = true }

# MongoDB deps
mongodb = { version = "3.5.1", optional = true, default-features = false, features = ["bson-3", "rustls-tls", "compat-3-3-0"] }
bson = { version = "3.1.0", features = ["chrono-0_4", "serde_with-3"], optional = true } # Needed for using chrono datetime in doc

# gRPC deps
tonic = { version = "0.14.6", optional = true }

# Redis deps
redis = { version = "1.0.5", optional = true, features = ["tokio-comp"] }

# Template engine deps
minijinja = { version = "2.11.0", features = ["loader"], optional = true }

# Mail deps
lettre = { version = "0.11.17", features = ["tokio1-native-tls"], optional = true }

# Gmail deps
reqwest = { version = "0.12", optional = true, default-features = false, features = ["native-tls", "json"] }
base64 = { version = "0.22", optional = true }

# Actix-web deps
actix-web = { version = "4.11", optional = true }

# Actix-filemanager deps
actix-multipart = { version = "0.7.2", optional = true }
actix-files = { version = "0.6.6", optional = true }

# Filemanager deps
tree_magic_mini = { version ="3.1.6", optional = true }
sanitize-filename = { version = "0.6.0", optional=true}

# Filemanager images deps
rgb = { version = "0.8.52", optional = true }
jpeg-decoder = { version = "0.3.2", optional = true }
png = { version = "0.18.1", optional = true }
jpeg-encoder = { version = "0.7.0", optional = true }
image-webp = { version = "0.2.3", optional = true }
resize = {version = "0.8.8", optional = true}

# Sqlx deps
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio"]}
