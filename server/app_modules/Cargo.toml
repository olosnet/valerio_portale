[package]
name = "app_modules"
version = "0.1.0"
edition = "2024"
authors = ["Valerio Faiuolo <valerio.faiuolo@errepinet.it>"]
description = "Current App Modules"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
mongodb = { version = "3" }
bson = { version = "3.1.0", features = [
    "chrono-0_4", "serde_with-3"
] } # Needed for using chrono datetime in doc
cornetti = { path = "../cornetti-rust/cornetti", features = [
    "mongo",
    "actix",
    "actix-auth",
    "redisdb",
    "templates",
    "mail",
    "filemanager",
    "filemanager-images",
    "actix-filemanager",
    "actix-filemanager-images",
] }
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
actix-web = "4.11.0"
futures = "0.3"
validator = { version = "0.20.0", features = ["derive"] }
actix-multipart = "0.7.2"
actix-files = "0.6.6"
redis = { version = "1.2.0" }
serde_json = "1.0.140"
minijinja = "2.11.0"
log = "0.4.27"
serde_with = "3.17.0"
uuid = { version = "1.18.1", features = ["v4"] }
lettre = { version = "0.11.17", features = ["tokio1-native-tls"] }